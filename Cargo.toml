[package]
name = "agilecrypto"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
subtle = "2"
ulid = "1"
zeroize = "1"

[lib]
crate-type = ["cdylib", "staticlib"]

[build-dependencies]
bindgen = "0.71.0"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
