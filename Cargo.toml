[package]
name = "agilecrypto"
version = "2.0.0"
edition = "2024"

[dependencies]
aes = "0.9.3"
aes-gcm = "0.11.1"
cbc = "0.2.1"
chacha20poly1305 = "0.11.0"
cipher = "0.5"
ctr = "0.10.1"
der = "0.8"
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["pkcs8", "alloc", "zeroize", "digest"] }
elliptic-curve = { version = "0.14", features = ["arithmetic", "sec1", "pkcs8", "alloc"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
libc = "0.2"
ml-dsa = { version = "0.1.1", features = ["pkcs8", "alloc", "zeroize", "rand_core"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8", "alloc"] }
p384 = { version = "0.14.0", features = ["ecdsa", "pkcs8", "alloc"] }
p521 = { version = "0.14.0", features = ["ecdsa", "pkcs8", "alloc"] }
pbjson = "0.9.0"
pbjson-types = "0.9.0"
pkcs8 = "0.11"
prost = "0.14.4"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11"
subtle = "2"
ulid = "1"
zeroize = "1"

[lib]
crate-type = ["cdylib", "staticlib"]

[build-dependencies]
bindgen = "0.71.0"
pbjson-build = "0.9.0"
prost = "0.14"
prost-build = "0.14.4"
prost-types = "0.14.4"
syn = { version = "2", features = ["full"] }
quote = "1"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }

[workspace]
members = [".", "xtask"]
