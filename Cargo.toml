[package]
name = "agilecrypto"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
pbjson = "0.9.0"
pbjson-types = "0.9.0"
prost = "0.14.4"
serde = "1.0.229"
serde_json = "1.0.154"
subtle = "2"
ulid = "1"
zeroize = "1"

[lib]
crate-type = ["cdylib", "staticlib"]

[build-dependencies]
bindgen = "0.71.0"
pbjson-build = "0.9.0"
prost = "0.14"
prost-build = "0.14.4"
prost-types = "0.14.4"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }

[workspace]
members = [".", "xtask"]
