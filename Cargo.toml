[package]
name = "agilecrypto"
version = "1.0.0"
edition = "2024"

[dependencies]
# Every crate that holds key-derived state is built with "zeroize": without
# it, round keys, GHASH/Poly1305 keys and HMAC state stay in freed memory
# after each operation (docs/performance.md, D2). Some are named here only
# to enable it (hmac: the RFC 6979 nonce DRBG; poly1305: ChaCha20-Poly1305's
# one-time key, which chacha20poly1305/zeroize leaves out).
aes = { version = "0.9.3", features = ["zeroize"] }
# Read-mostly maps (key index, policies): lookups write no shared cache line
# (docs/performance.md F7).
arc-swap = "1.9"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
cbc = { version = "0.2.1", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
cipher = { version = "0.5", features = ["zeroize"] }
ctr = { version = "0.10.1", features = ["zeroize"] }
der = "0.8"
# Signing from the private scalar alone (hazmat): no public-key derivation
# per call (docs/improvement-plan.md, phase 3).
ecdsa = { version = "0.17", default-features = false, features = ["algorithm", "der"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = [
    "pkcs8", "alloc", "zeroize", "digest", "hazmat",
] }
elliptic-curve = { version = "0.14", features = ["arithmetic", "sec1", "pkcs8", "alloc"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
libc = "0.2"
ml-dsa = { version = "0.1.1", features = ["pkcs8", "alloc", "zeroize", "rand_core"] }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8", "alloc"] }
p384 = { version = "0.14.0", features = ["ecdsa", "pkcs8", "alloc"] }
p521 = { version = "0.14.0", features = ["ecdsa", "pkcs8", "alloc"] }
pbjson = "0.9.0"
pbjson-types = "0.9.0"
pkcs8 = "0.11"
poly1305 = { version = "0.9", default-features = false, features = ["zeroize"] }
prost = "0.14.4"
sec1 = { version = "0.8", features = ["der"] }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = { version = "0.11", features = ["zeroize"] }
subtle = "2"
ulid = "1"
# 1.9.2: slice wipes are fill(0) behind a barrier (memset speed).
zeroize = "1.9.2"

[lib]
crate-type = ["cdylib", "staticlib"]

[build-dependencies]
bindgen = "0.72.1"
pbjson-build = "0.9.0"
prost = "0.14"
prost-build = "0.14.4"
prost-types = "0.14.4"
syn = { version = "2", features = ["full"] }
quote = "1"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }

[workspace]
members = [".", "xtask"]
